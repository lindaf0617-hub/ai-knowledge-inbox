<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>保存到 AI 知识库</title>
  <script src="theme.js"></script>
  <script src="i18n.js"></script>
  <link rel="stylesheet" href="shared.css">
  <style>
    body { width: 390px; background: var(--cp-surface); }
    main { padding: 18px; }
    .head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }
    h1 { margin: 0 0 4px; font-size: 20px; }
    .head p { margin: 0; color: var(--cp-text-muted); font-size: 12px; }
    .library-link {
      border: 0;
      padding: 4px;
      background: transparent;
      color: var(--cp-link);
      white-space: nowrap;
    }
    .popup-tools { display: flex; align-items: center; gap: 8px; }
    .language-picker {
      height: 30px;
      border: 1px solid var(--cp-border);
      border-radius: 0.625rem;
      background: var(--cp-surface);
      color: var(--cp-text);
    }
    #status {
      min-height: 18px;
      margin: 10px 0 0;
      color: var(--cp-success);
      font-size: 12px;
    }
    #backend {
      margin: -6px 0 12px;
      color: var(--cp-text-muted);
      font-size: 11px;
    }
    #pairing {
      display: none;
      margin: 0 0 14px;
      padding: 12px;
      border: 1px solid var(--cp-warning);
      border-radius: 10px;
    }
    #pairing p { margin: 0 0 8px; color: var(--cp-text-muted); font-size: 12px; }
    .pair-row { display: flex; gap: 8px; }
    .pair-row input { text-transform: uppercase; }
    html[data-skin="tech"] body {
      border-top: 4px solid var(--cp-accent);
      background:
        radial-gradient(circle at 90% 0, rgba(82, 216, 242, 0.2), transparent 35%),
        var(--cp-bg-elevated);
    }
    html[data-skin="tech"] main {
      margin: 8px;
      border: 1px solid var(--cp-border);
      border-radius: 20px;
      background: rgba(18, 39, 67, 0.9);
      box-shadow: var(--cp-shadow);
    }
    html[data-skin="tech"] h1 {
      background: linear-gradient(100deg, var(--cp-text), var(--cp-accent), var(--cp-success));
      background-clip: text;
      color: transparent;
    }
    .label-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }
    .label-row label { margin: 0; }
    .suggest-button {
      border: 0;
      padding: 2px 4px;
      background: transparent;
      color: var(--cp-link);
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main>
    <div class="head">
      <div>
        <h1>保存到知识库</h1>
        <p>自动带入当前页面选中的文字。</p>
      </div>
      <div class="popup-tools">
        <select class="language-picker" id="languagePicker" aria-label="界面语言">
          <option value="zh">中文</option>
          <option value="en">English</option>
        </select>
        <button class="library-link" id="openLibrary" type="button">打开知识库</button>
      </div>
    </div>
    <div id="backend">正在检测存储…</div>
    <form id="pairing">
      <p>在桌面伴侣菜单中生成配对码，然后在这里输入。</p>
      <div class="pair-row">
        <input id="pairingCode" maxlength="8" autocomplete="one-time-code" placeholder="8 位配对码">
        <button class="button" type="submit">配对</button>
      </div>
    </form>
    <form id="entryForm">
      <div class="field">
        <label for="content">内容</label>
        <textarea id="content" required placeholder="选中文字，或在这里粘贴…"></textarea>
      </div>
      <div class="field">
        <label for="title">标题</label>
        <input id="title" maxlength="120" placeholder="默认使用页面标题">
      </div>
      <div class="field">
        <label for="project">项目（可选）</label>
        <input id="project" maxlength="60" placeholder="例如：知识库 MVP">
      </div>
      <div class="field">
        <div class="label-row">
          <label for="tags">标签（可选）</label>
          <button class="suggest-button" id="suggestTags" type="button">重新建议</button>
        </div>
        <input id="tags" maxlength="200" placeholder="产品, Agent, 灵感">
        <p class="hint">根据当前内容在本地自动建议，可直接修改。</p>
      </div>
      <div class="field">
        <label for="source">来源</label>
        <input id="source" type="url" placeholder="https://…">
      </div>
      <div class="actions">
        <button class="button primary" type="submit">保存</button>
      </div>
      <div id="status" role="status"></div>
    </form>
  </main>
  <script src="storage.js"></script>
  <script src="popup.js"></script>
</body>
</html>
