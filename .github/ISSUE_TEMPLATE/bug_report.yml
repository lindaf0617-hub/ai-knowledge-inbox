name: Bug report
description: Report a reproducible problem without including private knowledge.
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Do not paste private knowledge, credentials, or confidential source text.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 1.4.0
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options:
        - Windows companion
        - Edge extension
        - Chrome extension
        - OneDrive sync
        - Ask knowledge base
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use non-sensitive sample data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
