name: Feature request
description: Suggest an improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What workflow is difficult today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: dropdown
    id: privacy
    attributes:
      label: Does this change how knowledge leaves the device?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
